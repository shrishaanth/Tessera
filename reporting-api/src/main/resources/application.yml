server:
  port: 8090
  # The default 8080 collides with an Oracle TNS listener on the development
  # machine this was built on, and with HBase's own REST server inside the
  # compose network. 8090 avoids both.

spring:
  application:
    name: tessera-reporting-api
  mvc:
    problemdetails:
      enabled: true

tessera:
  # Bound to the same environment variable names every other module uses, spelled
  # out here rather than left to Spring's relaxed binding. That would map
  # tessera.hbase-zk-quorum to TESSERA_HBASEZKQUORUM — correct, but unreadable and
  # inconsistent with TESSERA_HBASE_ZK as the streaming job spells it.
  #
  # The defaults suit running this service from an IDE against the compose stack's
  # published ports; the container overrides them with in-network names.
  hbase-zk-quorum: ${TESSERA_HBASE_ZK:localhost}
  hbase-zk-port: ${TESSERA_HBASE_ZK_PORT:2181}
  kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  alert-topic: ${TESSERA_ALERT_TOPIC:vehicle.alerts}
  alert-history: ${TESSERA_ALERT_HISTORY:200}
  history-windows: ${TESSERA_HISTORY_WINDOWS:60}
  area-name: ${TESSERA_AREA_NAME:Downtown Boston (demo area)}

logging:
  level:
    root: info
    # The HBase and ZooKeeper clients log a connection banner and a line per retry.
    # Errors still surface; the routine handshake does not.
    org.apache.hadoop.hbase: warn
    org.apache.zookeeper: error
    org.apache.kafka.clients.consumer.internals: warn
    org.apache.kafka.clients.Metadata: warn
