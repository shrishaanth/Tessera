# Tessera Risk — local stack.
#
# Kafka runs in KRaft mode (no separate ZooKeeper service). HBase standalone
# brings its own embedded ZooKeeper on 2181, so running a second one purely for
# Kafka would add a service, ~0.5 GB of memory and an extra failure mode for no
# benefit. ZooKeeper is still in the stack — it is just inside HBase.
#
# Memory: this stack wants roughly 4-6 GB of container memory. On Docker Desktop
# with the WSL 2 backend that is governed by ~/.wslconfig, not Docker's settings.

services:
  # The official Apache Kafka image, published by the Kafka project itself.
  # (bitnami/kafka is not used: Bitnami restructured their public catalogue in
  # 2025 and the community tags moved out from under bitnami/.)
  kafka:
    image: apache/kafka:3.7.1
    hostname: kafka
    ports:
      - "29092:29092"   # host access, e.g. running a job or the producer from an IDE
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Two client listeners. A broker tells clients where to reach it via the
      # *advertised* address, so a single listener advertising "kafka:9092" is
      # unreachable from the host (that name only resolves inside the compose
      # network), while one advertising "localhost" is unreachable from other
      # containers. Hence one of each: INTERNAL for container-to-container,
      # EXTERNAL for anything running on the host.
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Fixed cluster id so the log directory survives a restart rather than being
      # reformatted with a new identity each time.
      CLUSTER_ID: "TesseraRiskKRaftCluster"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Single-node development cluster: one replica of everything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Creates the two topics the pipeline uses, then exits. Topics are created
  # explicitly rather than by auto-create so partition counts are deliberate:
  # vehicle.telemetry is partitioned by vehicleId, and per-vehicle ordering within
  # a partition is what the windowed aggregation relies on.
  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # A literal block (|), not a folded one (>): in a folded scalar YAML preserves
    # the newline before any line indented deeper than the first, which would hand
    # bash each continuation as a separate command.
    command:
      - |
        set -e
        TOPICS=/opt/kafka/bin/kafka-topics.sh
        $$TOPICS --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle.telemetry --partitions 6 --replication-factor 1
        $$TOPICS --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle.alerts --partitions 1 --replication-factor 1
        echo '--- topics created ---'
        $$TOPICS --bootstrap-server kafka:9092 --list
    restart: "no"

  hbase:
    image: harisekhon/hbase:2.1
    hostname: hbase
    ports:
      - "16010:16010"   # Master web UI
      - "16000:16000"   # Master RPC
      - "16020:16020"   # RegionServer RPC
      - "2181:2181"     # embedded ZooKeeper
    volumes:
      - hbase-data:/hbase-data
    # Three checks, none of which starts a JVM.
    #
    # Not `hbase shell status`: that spawns a JVM every 15 seconds, competing with
    # the workload, and under write load it could not finish inside its own timeout
    # — so the service flapped to unhealthy while serving perfectly well.
    #
    # But ports alone are not enough either, and that is the more dangerous
    # mistake. Standalone HBase has two distinct failure modes here. Its region
    # server aborts when the embedded ZooKeeper expires its session, leaving
    # ZooKeeper, REST and Thrift listening while the master and region server are
    # gone — ports catch that. And after a dirty shutdown the master can come up,
    # bind every port, and then wedge forever reconciling hbase:meta against the
    # region server that died; ports call that healthy, dependents start against
    # it, and their writes hang.
    #
    # masterFinishedInitializationTime is 0 until the master genuinely finishes
    # initialising, which separates the two. The daemons bind to the container's
    # own hostname rather than loopback, so $$(hostname) is required — localhost is
    # refused even on a healthy cluster.
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 $$(hostname) 2181 | grep -q imok && nc -z -w 2 $$(hostname) 16020 && wget -q -O - -T 3 \"http://$$(hostname):16010/jmx?qry=Hadoop:service=HBase,name=Master,sub=Server\" | grep -q '\"masterFinishedInitializationTime\" : [1-9]'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # The Spark Structured Streaming job. Behind a profile so that `docker compose
  # up -d` brings up only the infrastructure: the job runs from a jar that has to
  # be built first, and a default service that fails until `mvn install` has run
  # would make a fresh clone look broken.
  #
  #   mvn install -DskipTests
  #   docker compose --profile pipeline up streaming-job
  streaming-job:
    # The java17 tag, not the bare 3.5.3 one: that defaults to a Java 11 runtime,
    # which cannot load the records in the shared event model (class file 61).
    image: apache/spark:3.5.3-scala2.12-java17-ubuntu
    profiles: ["pipeline"]
    depends_on:
      kafka:
        condition: service_healthy
      hbase:
        condition: service_healthy
    # The image runs as uid 185, which cannot write to a freshly created named
    # volume. Root is the short answer for a local development stack; a deployed
    # one would fix the ownership in an init container instead.
    user: root
    environment:
      # Container-to-container, so the INTERNAL listener and the HBase service name.
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      TESSERA_HBASE_ZK: "hbase"
      TESSERA_CHECKPOINT_DIR: "/checkpoints/risk-windows"
      # earliest, not latest: when the job starts after the producer, the
      # telemetry already on the topic is what makes the first windows non-empty.
      TESSERA_STARTING_OFFSETS: "earliest"
    volumes:
      - ./streaming-job/target:/opt/tessera:ro
      - ./infra/spark:/opt/tessera-conf:ro
      - spark-checkpoints:/checkpoints
    # spark-submit directly rather than through the image's entrypoint, which
    # expects the argument shape Spark's Kubernetes scheduler passes it.
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      # The ",4" is the task-failure budget. In local mode Spark ignores
      # spark.task.maxFailures and defaults to 1, so without it a single retryable
      # HBase error terminates the query. See StreamingConfig.
      - "local[2,4]"
      - "--driver-memory"
      - "1500m"
      # driver-java-options, not spark.driver.extraJavaOptions: in local mode the
      # driver JVM *is* the one spark-submit launches, and extraJavaOptions is
      # applied only when a separate driver process is spawned.
      - "--driver-java-options"
      - "-Dlog4j.configurationFile=file:///opt/tessera-conf/log4j2.properties"
      - "--class"
      - "com.tessera.risk.streaming.StreamingMain"
      - "/opt/tessera/streaming-job-1.0.0.jar"

volumes:
  kafka-data:
  hbase-data:
  spark-checkpoints:

# NOTE ON HBASE HOSTNAMES
# HBase hands clients the *hostname* of the region server, not an IP. Inside this
# compose network that resolves via Docker DNS, so container-to-container access
# works. To connect from the host (running a Spark job in an IDE, say), add:
#     127.0.0.1  hbase
# to the host's hosts file, otherwise the client will resolve 'hbase' and fail.
