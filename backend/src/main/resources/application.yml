spring:
  application:
    name: tessera-fleet
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
  # The durable layer is wired manually (see DurableConfig, profile "durable"),
  # so Boot's DataSource/JDBC/Flyway auto-configuration stays out of the way.
  # Without the "durable" profile the system runs on an in-memory durable store —
  # live dispatch is unaffected either way (SRS §2.5, NFR-3).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    com.tessera.fleet: INFO

# ---------------------------------------------------------------------------
# Tessera Fleet configuration (SRS §3.2, Appendix B)
# ---------------------------------------------------------------------------
tessera:
  # A vehicle silent for longer than this resolves to OFFLINE on the map (FR-1.1).
  # Sized for the 1 Hz dataset feed; raise it to ~120 for GTFS_REALTIME, whose
  # vehicles report every ~5–30 s and drop in and out of the feed.
  offline-after-seconds: ${TESSERA_OFFLINE_AFTER_SECONDS:30}
  # Ingestion pull cadence and live-map push cadence. Both well under the
  # 2-second UI-freshness bound (FR-1.2 / NFR-2).
  ingest-poll-millis: 1000
  broadcast-millis: 1000

  # Which live position feed to run (SRS §2.6, FR-7).
  #   DATASET        — replay the pre-generated trajectory dataset (default).
  #                    Simulated, but generated against the real OSM road network
  #                    under real speed limits and physical accel/braking limits,
  #                    so vehicles drive continuously and never jump.
  #   GTFS_REALTIME  — a real public transit agency feed (see `gtfs` below).
  position-source: ${TESSERA_POSITION_SOURCE:DATASET}

  dataset:
    resource: ${TESSERA_DATASET:classpath:dataset/fleet-round.ndjson.gz}

  # Used when position-source=GTFS_REALTIME. Defaults to the MBTA's free, no-key
  # feed, which covers the same downtown-Boston area as the bundled road graph.
  gtfs:
    feed-url: ${TESSERA_GTFS_URL:https://cdn.mbta.com/realtime/VehiclePositions.pb}
    api-key: ${TESSERA_GTFS_KEY:}
    api-key-header: ${TESSERA_GTFS_KEY_HEADER:}
    poll-millis: ${TESSERA_GTFS_POLL_MILLIS:10000}
    agency-label: ${TESSERA_GTFS_AGENCY:MBTA}

  # Real OSM road network for the area — shown in the data-source panel (FR-7)
  # and used to label the map area.
  road-graph-resource: classpath:roadgraph/roadgraph.json

  # Geofencing & dwell-time tracking (FR-3).
  geofence:
    # Minimum time a vehicle must stay on the new side of a boundary before an
    # enter/exit is treated as real — debounces GPS jitter (FR-3.4).
    debounce-seconds: 20
    # Default dwell-time alert threshold; a site may override it (FR-3.5).
    default-dwell-alert-seconds: 1800

  # Address autocomplete / geocoding (FR-6). Nominatim (SRS §5.2): free, public,
  # rate-limited to ~1 req/s and requires an identifying User-Agent. Point
  # base-url at a self-hosted Nominatim to remove the limit.
  geocoding:
    base-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    user-agent: ${NOMINATIM_UA:tessera-fleet/1.0 (self-hosted deployment)}
    min-interval-ms: 1100
    cache-size: 500
    timeout-ms: 6000
    max-results: 8

  # Trajectory replay (FR-5). A day of 1 Hz positions is ~86k points; sample down
  # for the browser.
  replay:
    max-points: 3000

  # Historical reporting (FR-4). `min-*` are the explicit answer to SRS Appendix B:
  # the average-dwell figures are not presented as reliable until this much
  # history and this many recorded site visits exist (FR-4.4).
  reporting:
    min-collection-days: 14
    min-site-exits: 20
    synthetic-history: false

  # Durable layer write-behind (SRS §3.1). The queue is bounded; when it is full
  # or the database is unreachable, positions are dropped and counted — the live
  # path is never blocked (SRS §2.5).
  durable:
    # in-memory (default) | postgres (activated by the "durable" profile)
    mode: ${TESSERA_DURABLE_MODE:in-memory}
    queue-capacity: 50000
    batch-size: 500
    flush-millis: 1000
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/tessera}
      username: ${DB_USER:tessera}
      password: ${DB_PASSWORD:tessera}

  # NFR-7 — accounts permitted to sign in. Dev defaults use {noop} passwords;
  # override with {bcrypt} hashes via config in any real deployment.
  users:
    - username: dispatch
      password: "{noop}dispatch"
      role: DISPATCHER
    - username: ops
      password: "{noop}ops"
      role: OPS_MANAGER

---
spring:
  config:
    activate:
      on-profile: demo
tessera:
  # Tighter thresholds so geofence enters/exits and dwell alerts are visible
  # within a short demo session rather than a real shift.
  geofence:
    debounce-seconds: 6
    # Low so a slow pass through a demo site trips a dwell alert within a
    # short session; a real deployment uses minutes (see the default above).
    default-dwell-alert-seconds: 25
  # The demo back-fills synthetic site-visit history so the dwell report renders
  # — flagged so the UI says the figures are demo data (FR-4.4 honesty).
  reporting:
    synthetic-history: true

---
spring:
  config:
    activate:
      on-profile: durable
tessera:
  durable:
    mode: postgres
