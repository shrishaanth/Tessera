# Logging for the Spark jobs.
#
# Spark's own default is INFO on the root logger, which for a streaming query
# means a few hundred lines per micro-batch: offset ranges, state store metrics,
# block manager chatter, a full progress report every trigger. The job's own
# output — batch sizes and alerts — scrolls past unread inside it.
#
# So: the frameworks are quiet, and com.tessera.risk is not.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n

logger.tessera.name = com.tessera.risk
logger.tessera.level = info

# Kept at INFO: this is the line that says a query actually started and which
# offsets it resumed from, which is the first thing worth seeing when a restart
# does not behave.
logger.streaming.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.streaming.level = warn

# HBase and ZooKeeper clients log a connection banner and a retry line per
# attempt. Errors still surface; the routine handshake does not.
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = error
logger.hbase.name = org.apache.hadoop.hbase
logger.hbase.level = warn

# Spark's shutdown hook logs a spurious stack trace when a local run is stopped
# with Ctrl-C, which reads like a crash and is not one.
logger.shutdown.name = org.apache.spark.util.ShutdownHookManager
logger.shutdown.level = error
